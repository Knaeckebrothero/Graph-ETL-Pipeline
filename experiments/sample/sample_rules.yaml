# Sample rules, DRAFT 0.1 of 12 November 2026. Not frozen. Every value marked "proposal" is to be
# confirmed by the author before the manifest is hashed (planned: development and pilot buckets
# 14 Nov, full manifest 18 Nov 2026). Register: EX-05 (units), BE-01 (strata), BE-02 (jurisdictions),
# BE-05 (buckets), BE-06 (authority classes), EX-16 (canary bucket).
version: draft-0.2
seed: 20261113                     # proposal
pdf_extractor: "pdftotext -layout" # version is written into the manifest at cut time

chunk:                              # proposals; one fixed size per modality (EX-05)
  rows_per_unit: 20                 # table segment: header row plus this many data records
  records_per_unit: 10              # nested records rendered as a JSON list
  catalogue_universe_cap: 200       # seeded draw of eligible entries per catalogue source; one entry per unit

buckets:                            # decided 13 Nov 2026; units per modality stratum, drawn round-robin over sources
  development_per_stratum: 8        # read by the schema induction (EX-06), template work and probes
  pilot_per_stratum: 3              # read by the pilot only; disjoint from development
                                    # a stratum with too few free units fills its pilot from sources marked pilot_allowed
                                    # (decided 13 Nov: the numeric pilot units come from the Munich or Berlin fee statutes)
shares:                             # decided 13 Nov 2026 (BE-02): the shares apply to units tied to a city or the campus;
  frankfurt_and_campus_min: 0.70    # federal and product units are reported as their own groups
  contrast_city_each: 0.15
  # every other cut unit is "candidate": it becomes held-out or stays unselected at the full freeze

# stratum: numeric tabular | tabular-categorical | catalogue | free text
# authority_class: A federal or state law | B binding municipal or institutional | C official guidance | D derivative
# display_title, display_publisher, applies_to: the only source identity the agent sees. Keep them in the
# source's language and free of curator remarks.
