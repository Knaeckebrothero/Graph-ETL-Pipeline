    include: true
    reader: csv_rows
    delimiter: ","
    stratum: tabular-categorical
    jurisdiction: Frankfurt
    authority_class: C              # provisional: who merged the list is undocumented; C or D
    display_title: "Abfall-ABC"
    display_publisher: "FES Frankfurter Entsorgungs- und Service GmbH"   # to verify: list may merge two publishers
    applies_to: "Frankfurt am Main"
