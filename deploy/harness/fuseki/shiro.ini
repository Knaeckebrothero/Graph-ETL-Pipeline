# Access rules for the harness Fuseki (development).
# One account, "admin", for the admin interface (/$/...) and for every dataset.
# Development password; the port is bound to localhost. For the runs, the password
# comes from outside this repository.

[main]
plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher

[users]
admin = harness_dev

[urls]
/$/ping = anon
/**     = authcBasic,user[admin]
